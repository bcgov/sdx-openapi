extends: [[spectral:oas, recommended]]   # start from Spectral’s official recommended set

rules:
  # Override some recommended rules to make them stricter or friendlier
  info-contact: error                      # contact object is now mandatory
  info-license: error                      # license is mandatory
  info-description: error
  operation-description: error
  operation-tags: error
  operation-summary: error
  operation-operationId: error
  operation-success-response: error        # must define at least one 2xx response

  # Pagination enforcement (common internal pattern)
  pagination-parameters:
    description: Paginated endpoints must have limit & offset or cursor
    message: "{{error}} – consider adding limit/offset or cursor pagination"
    given: $.paths[*][get,post,patch,put,delete]
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: (?i)(limit|offset|cursor|page|since)

  # Example enforcement
  oas3-examples: error
  oas3-valid-schema-example: error

  # Security – at least one scheme defined globally or per-operation
  no-undefined-security:
    description: Every operation must be covered by a security requirement
    given: $.paths.*.*[security]
    severity: hint
    then:
      function: truthy