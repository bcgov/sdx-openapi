openapi: 3.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
info:
  title: Sample API
  version: 1.0.0
  description: This is a sample API.
  contact:
    name: API Support
    email: support@example.com
    url: https://www.example.com/support
tags:
  - name: pets
    description: Operations related to pets
paths:
  /pets:
    get:
      operationId: listPets
      tags:
        - pets
      summary: List all pets
      description: Returns a paginated list of all pets available in the store.
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string