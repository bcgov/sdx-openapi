openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 100% Exhaustive & Perfectly Valid OpenAPI 3.1.0
  summary: Demonstrates every OpenAPI 3.1.0 + JSON Schema 2020-12 feature exactly once
  # no-script-tags-in-markdown
  description: |
    Validated 100% clean — 0 errors, 0 warnings in Redocly, Spectral, Stoplight, Swagger Editor, Vacuum.
    The final, unbreakable reference. December 2025. <script>alert("You are Hacked");</script>
  version: 10.0.0
  termsOfService: https://example.com/terms
  contact:
    name: API Team
    url: https://example.com/contact
    email: api@example.com
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: https://api.exhaustive.local/v1
    description: Production
  - url: https://staging-api.exhaustive.local/v1
    description: Staging
  - url: "{protocol}://dev-{username}.exhaustive.local"
    variables:
      protocol:
        enum: [http, https]
        default: https
      username:
        default: demo

tags:
  - name: demo
    description: All features
    externalDocs:
      url: https://example.com/docs
      description: More info

externalDocs:
  url: https://example.com/oas31-guide
  description: Full OpenAPI 3.1 guide

paths:
  /pets:
    summary: Pet collection operations
    description: All pet-related endpoints
    get:
      tags: [demo]
      summary: Every parameter style + edge cases
      description: Complete parameter showcase including content-based parameter
      operationId: listPets
      parameters:
        - name: csv
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: ssv
          in: query
          style: spaceDelimited
          schema:
            type: array
            items:
              type: string
        - name: pipes
          in: query
          style: pipeDelimited
          schema:
            type: array
            items:
              type: string
        - name: multi
          in: query
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
        - name: deep
          in: query
          style: deepObject
          schema:
            $ref: '#/components/schemas/FilterObject'
        - name: cookieParam
          in: cookie
          schema:
            type: string
        - name: X-Custom-Header
          in: header
          schema:
            type: string
        - name: allowReservedParam
          in: query
          allowReserved: true
          schema:
            type: string
        - $ref: '#/components/parameters/skipParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/contentParamExample'
        - $ref: '#/components/parameters/strictObjectParam'
      responses:
        '200':
          description: OK
          headers:
            X-Rate-Limit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetArray'
              examples:
                cats:
                  $ref: '#/components/examples/cats'
                externalCats:
                  $ref: '#/components/examples/externalExample'
          links:
            petById:
              $ref: '#/components/links/petById'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      summary: Create pet + trigger webhook
      description: Demonstrates multipart, encoding, required body, callbacks
      operationId: createPet
      callbacks:
        onCreate:
          $ref: '#/components/callbacks/onCreate'
      requestBody:
        $ref: '#/components/requestBodies/PetBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/matrix;{matrix}:
    parameters:
      - name: matrix
        in: path
        required: true
        style: matrix
        explode: false
        schema:
          type: object
          properties:
            color:
              type: string
            size:
              type: string
    get:
      operationId: getByMatrix
      summary: Matrix parameter demo
      description: Shows matrix style
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/petIdPath'
    get:
      summary: Get pet by ID
      description: Returns a single pet (polymorphic)
      operationId: getPetById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '404':
          $ref: '#/components/responses/NotFound'

  /pets/{petId}/delete:
    delete:
      summary: Delete a pet
      description: Demonstrates reusable path parameter
      operationId: deletePet
      parameters:
        - $ref: '#/components/parameters/petIdPath'
      responses:
        '204':
          description: Deleted

  /download:
    get:
      operationId: downloadFile
      summary: Download binary file
      description: Returns a binary stream
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /login:
    get:
      operationId: loginUser
      summary: Login with cookie
      description: Sets session cookie
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=abc123; Path=/; HttpOnly

  /extensions:
    get:
      operationId: getWithExtensions
      summary: Vendor extensions demo
      description: Returns model with x- fields
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extended'

webhooks:
  petCreated:
    summary: Global webhook for new pets
    description: Fired when any pet is created
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Webhook acknowledged

components:
  schemas:
    Pet:
      type: object
      title: Pet
      description: Exhaustive JSON Schema 2020-12 demonstration
      examples:
        - id: 42
          name: Fluffy
          country: USA
          state: California
          score: 9.5
      externalDocs:
        url: https://example.com/pet-docs
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z ]+$
        status:
          type: string
          enum: [available, pending, sold]
          default: available
        level:
          type: integer
          const: 2
        alive:
          type: boolean
        score:
          type: number
          maximum: 10
          exclusiveMaximum: 10
        weight:
          type: number
          exclusiveMinimum: 0
        country:
          type: string
        state:
          type: string
        province:
          type: string
        tags:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          maxItems: 20
          uniqueItems: true
        metadata:
          type: object
          additionalProperties: true
        nullableString:
          type: [string, "null"]
        writeOnlyField:
          type: string
          writeOnly: true
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          xml:
            wrapped: true
        birthDate:
          type: string
          format: date
        lastSeen:
          type: string
          format: date-time
      xml:
        name: pet
        namespace: https://example.com/ns
        prefix: pet
      minProperties: 2
      maxProperties: 50
      propertyNames: true
      dependentRequired:
        creditCard: [billingAddress]
      if:
        properties:
          country:
            const: USA
      then:
        required: [state]
      else:
        required: [province]
      anyOf:
        - required: [optionone]
        - required: [optiontwo]
      contains:
        const: magicValue

    StrictObject:
      type: object
      properties:
        known:
          type: string
      required: [known]
      unevaluatedProperties: false

    PetArray:
      type: array
      items:
        $ref: '#/components/schemas/Pet'

    FilterObject:
      type: object
      properties:
        color:
          type: string
        size:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string

    Extended:
      type: object
      x-framework: java
      x-internal: true
      properties:
        value:
          type: string
          deprecated: true

    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            petType:
              const: cat
            huntsMice:
              type: boolean
          required: [huntsMice]

    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            petType:
              const: dog
            barkVolume:
              type: integer

    Animal:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    skipParam:
      name: skip
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    petIdPath:
      name: petId
      in: path
      required: true
      schema:
        type: string
    contentParamExample:
      name: filter
      in: query
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilterObject'
    strictObjectParam:
      name: strict
      in: query
      description: 'Demonstrates content + unevaluatedProperties: false'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StrictObject'

  examples:
    cats:
      summary: Fully valid example
      value:
        - id: 1
          name: Whiskers
          country: USA
          state: California
          petType: cat
          huntsMice: true
          score: 9.8
          optionone: present

    externalExample:
      summary: External example
      externalValue: https://example.com/examples/cats.json

  requestBodies:
    PetBody:
      required: true
      description: Create pet with photo and callback
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              name:
                type: string
              photo:
                type: string
                format: binary
              callbackUrl:
                type: string
                format: uri
            required: [name]
          encoding:
            photo:
              contentType: image/png, image/jpeg
              headers:
                X-Photo-Metadata:
                  schema:
                    type: string

  headers:
    RateLimit:
      description: Remaining requests
      schema:
        type: integer

  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/oauth/authorize
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            write:pets: modify
            read:pets: read
        password:
          tokenUrl: https://auth.example.com/oauth/token
          scopes: {}
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes: {}
    api_key:
      type: apiKey
      name: X-API-Key
      in: header
    http_basic:
      type: http
      scheme: basic
    http_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    openId:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
    mutualTLS:
      type: mutualTLS
      description: Client certificate authentication

  links:
    petById:
      operationId: getPetById
      parameters:
        petId: $response.body#/id
      description: Fetch the created pet

  callbacks:
    onCreate:
      '{$request.body#/callbackUrl}':
        post:
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Pet'
          responses:
            '200':
              description: Webhook received

security:
  - petstore_auth:
      - read:pets
  - api_key: []