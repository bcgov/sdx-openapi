openapi: 3.1.0
info:
  title: Example API with wellformedness violations
  version: 1.0.0
  description: Example API with wellformedness violations

tags:
  - name: "Aardvark"
  - name: "Badger"
  - name: "Moose"

paths:
  /users:
    get:
      operationId: get-users
      description: Get Users
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      operationId: create-user
      description: Create a User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      operationId: get-user
      description: Get a User by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: delete-user
      description: Delete a User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: User has been successfully deleted.

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        created:
          anyOf:
            - type: string
              format: date-time
            - type: integer
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        roles:
          type: array
          items:
            type: string
            enum: [admin, editor, viewer]
      required:
        - id
        - status

    CreateUserRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE