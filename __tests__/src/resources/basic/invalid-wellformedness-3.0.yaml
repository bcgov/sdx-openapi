            minimum: 1
      responses:
        '201':

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        created:
          anyOf:
            - type: string
              format: date-time
            - type: integer
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            # duplicated-entry-in-enum
            - ACTIVE
            # Enum values should respect the type specifier.
            - 1
        roles:
          # array-items
          type: array
      required:
        - id
        - status