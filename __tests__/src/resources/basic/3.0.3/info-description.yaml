openapi: 3.0.3
info:
  title: 100% Exhaustive & Perfectly Valid OpenAPI 3.0.3
  # info-description
  # description: |
  #   Demonstrates every single OpenAPI 3.0.3 feature exactly once.
  #   Validated clean with all major tools — December 2025.
  version: 10.0.0
  termsOfService: https://example.com/terms
  contact:
    name: API Team
    url: https://example.com/contact
    email: api@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.exhaustive.local/v1
    description: Production
  - url: https://staging-api.exhaustive.local/v1
    description: Staging
  - url: "{protocol}://dev-{username}.exhaustive.local"
    variables:
      protocol:
        enum: [http, https]
        default: https
      username:
        default: demo

tags:
  - name: demo
    description: All features
    externalDocs:
      url: https://example.com/docs
      description: More info

externalDocs:
  url: https://example.com/oas3-guide
  description: Full guide

paths:
  /pets:
    get:
      tags: [demo]
      summary: Every query style/explode combination
      description: Complete query parameter showcase
      operationId: listPets
      parameters:
        - name: csv
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: ssv
          in: query
          style: spaceDelimited
          schema:
            type: array
            items:
              type: string
        - name: pipes
          in: query
          style: pipeDelimited
          schema:
            type: array
            items:
              type: string
        - name: multi
          in: query
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
        - name: deep
          in: query
          style: deepObject
          schema:
            $ref: '#/components/schemas/FilterObject'
        - $ref: '#/components/parameters/skipParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: OK
          headers:
            X-Rate-Limit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetArray'
              examples:
                cats:
                  $ref: '#/components/examples/cats'
          links:
            petById:
              $ref: '#/components/links/petById'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create pet + trigger callback
      description: Demonstrates multipart, file upload and callbacks
      operationId: createPet
      callbacks:
        onCreate:
          $ref: '#/components/callbacks/onCreate'
      requestBody:
        $ref: '#/components/requestBodies/PetBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/matrix;{matrix}:
    parameters:
      - name: matrix
        in: path
        required: true
        style: matrix
        explode: false
        schema:
          type: object
          properties:
            color:
              type: string
            size:
              type: string
    get:
      operationId: getByMatrix
      summary: Matrix parameter demo
      description: Shows matrix style in path
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/petIdPath'
    get:
      summary: Get pet by ID
      description: Returns a single pet (polymorphic)
      operationId: getPetById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /download:
    get:
      operationId: downloadFile
      summary: Download binary file
      description: Returns a binary stream
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /login:
    get:
      operationId: loginUser
      summary: Login with cookie
      description: Sets session cookie
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=abc123; Path=/; HttpOnly

  /extensions:
    get:
      operationId: getWithExtensions
      summary: Vendor extensions demo
      description: Returns model with x- fields
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extended'

components:
  schemas:
    Pet:
      type: object
      title: Pet
      description: Every possible schema keyword
      example:
        id: 42
        name: Fluffy
        score: 9.5
      externalDocs:
        url: https://example.com/pet-docs
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z ]+$
        status:
          type: string
          enum: [available, pending, sold]
          default: available
        level:
          type: integer
          format: int32
          enum: [1, 2, 3]
        alive:
          type: boolean
        score:
          type: number
          format: float
          minimum: 0
          maximum: 10
          exclusiveMaximum: true
          multipleOf: 0.5
        weight:
          type: number
          format: double
        tags:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          maxItems: 20
          uniqueItems: true
        metadata:
          type: object
          additionalProperties:
            type: string
        binaryData:
          type: string
          format: byte
        raw:
          type: string
          format: binary
        photoUrls:
          type: array
          items:
            type: string
            format: uri
          xml:
            wrapped: true
        birthDate:
          type: string
          format: date
        lastSeen:
          type: string
          format: date-time
        email:
          type: string
          format: email
        uuid:
          type: string
          format: uuid
      xml:
        name: Pet

    PetArray:
      type: array
      items:
        $ref: '#/components/schemas/Pet'

    FilterObject:
      type: object
      properties:
        color:
          type: string
        size:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    Extended:
      type: object
      x-framework: java
      x-internal: true
      properties:
        value:
          type: string
          deprecated: true

    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            petType:
              type: string
              enum: [cat]
            huntsMice:
              type: boolean
          required: [huntsMice]

    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            petType:
              type: string
              enum: [dog]
            barkVolume:
              type: integer

    Animal:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'

  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    skipParam:
      name: skip
      in: query
      description: Number of items to skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    petIdPath:
      name: petId
      in: path
      description: The id of the pet to retrieve
      required: true
      schema:
        type: string

  examples:
    cats:
      summary: Example cats
      value:
        - id: 1
          name: Whiskers
          petType: cat
          huntsMice: true

  requestBodies:
    PetBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              name:
                type: string
              photo:
                type: string
                format: binary
              callbackUrl:
                type: string
                format: uri
            required: [name]
      description: Pet create form with optional webhook URL

  headers:
    RateLimit:
      description: Requests remaining in current window
      schema:
        type: integer

  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/oauth/authorize
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            write:pets: modify
            read:pets: read
        implicit:
          authorizationUrl: https://auth.example.com/oauth/authorize
          scopes:
            write:pets: modify
            read:pets: read
        password:
          tokenUrl: https://auth.example.com/oauth/token
          scopes: {}
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes: {}
    api_key:
      type: apiKey
      name: X-API-Key
      in: header
    http_basic:
      type: http
      scheme: basic
    http_bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    openId:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration

  links:
    petById:
      operationId: getPetById
      parameters:
        petId: $response.body#/id

  callbacks:
    onCreate:
      '{$request.body#/callbackUrl}':
        post:
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Pet'
          responses:
            '200':
              description: Webhook acknowledged

security:
  - petstore_auth:
      - read:pets
  - api_key: []