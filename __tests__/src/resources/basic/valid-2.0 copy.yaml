swagger: '2.0'
info:
  title: Example API with wellformedness violations
  version: 1.0.0
  description: Example API with wellformedness violations
host: api.example.com
schemes:
  - https
tags:
  - name: "Aardvark"
  - name: "Badger"
  - name: "Moose"
paths:
  /users:
    get:
      operationId: get-users
      description: Get Users
      produces:
        - application/json
      parameters:
        - name: status
          in: query
          required: false
          type: string
      responses:
        '200':
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
    post:
      operationId: create-user
      description: Create a User
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        '201':
          schema:
            $ref: '#/definitions/User'
  /users/{id}:
    get:
      operationId: get-user
      description: Get a User by ID
      produces:
        - application/json
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          schema:
            $ref: '#/definitions/User'
    delete:
      operationId: delete-user
      description: Delete a User
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          format: int64
          minimum: 1
      responses:
        '201':
          description: User has been successfully deleted.
definitions:
  User:
    type: object
    properties:
      id:
        type: integer
        format: int64
        readOnly: true
      created:
        type: string
        format: date-time
      status:
        type: string
        enum:
          - ACTIVE
          - INACTIVE
      roles:
        type: array
        items:
          type: string
          enum: [admin, editor, viewer]
    required:
      - id
      - status
  CreateUserRequest:
    type: object
    required:
      - status
    properties:
      status:
        type: string
        enum:
          - ACTIVE
          - INACTIVE