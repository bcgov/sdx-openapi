version: '3'

services:

  mock:
    image: stoplight/prism:5.14.2
    platform: linux/amd64
    command: mock -h 0.0.0.0 /prism/Catalog-public.v1.yaml
    volumes:
      - ./specifications/MIN.CITZ.SDX:/prism
    ports:
      - "4010:4010"

  proxy:
    image: stoplight/prism:5.14.2
    platform: linux/amd64
    command: proxy -h 0.0.0.0 /prism/Member-public.v1.yaml ${PROXY_TARGET}
    volumes:
      - ./specifications/MIN.CITZ.SDX:/prism
    ports:
      - "8000:4010"
