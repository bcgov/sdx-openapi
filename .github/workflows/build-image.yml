name: Build CSIT API Governance Spectral Image
on:
  push:
    branches: [ APS-3726_minimal_ruleset ]
    paths:
      - 'spectral-level-1.yaml'
      - 'spectral-level-2.yaml'
      - 'spectral-level-3.yaml'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bcgov/csit-api-governance-spectral-rules:latest