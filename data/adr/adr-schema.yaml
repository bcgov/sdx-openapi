$schema: "http://json-schema.org/draft-07/schema#"
title: Authoritative Data Register
type: object
required:
  - registrar
  - organization
  - dateCreated
  - authoritativeDataSourceName
  - uniqueIdentifier
  - businessConcept
  - sector
  - status
properties:
  registrar:
    type: string
    description: The person who is in the role of data custodian responsible for the register
  organization:
    type: string
    description: The name of the Ministry or Crown Corporation that is the data custodian
  subOrganization:
    type: string
    description: The name of the branch or division that is the data custodian
  dateCreated:
    type: string
    format: date
    description: The date when the authoritative data became active and available as such
  dateModified:
    type: string
    format: date
    description: The date of the last release of data/API changes
  description:
    type: string
    description: See metadata standard
  format:
    type: string
    description: See metadata standard
  informationSchedule:
    type: string
    description: See metadata standard
  securityClassification:
    type: string
    description: See metadata standard
  authoritativeDataSourceName:
    type: string
    description: Name of the authoritative data source (Title)
  uniqueIdentifier:
    type: integer
    description: Sequential number. This is an administrative ID
  businessConcept:
    type: string
    description: The nature of the data held in the authoritative data solution
  bcDataCatalogueMetadataRecordUuid:
    type: string
    format: uuid
    description: BC Data Catalogue record UUID
  sector:
    type: string
    description: The sector of government that oversees this authoritative data
  status:
    type: string
    description: The current status of the authoritative data solution
  linkToEnterpriseDataBlueprint:
    type: string
    format: uri
    description: A hyperlink to the section of the Enterprise Data Blueprint that describes this authoritative data
