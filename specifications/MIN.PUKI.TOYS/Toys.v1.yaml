openapi: 3.1.1

info:
  title: Toys
  version: "1.0"
  summary: |-
    This is a prototype API for the Toys service. It is intended for testing and development purposes only.
  description: |-
    Description about the service and its purpose.

  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"

  contact:
    name: API Programme Services Team
    url: https://chat.developer.gov.bc.ca/channel/aps-ops

servers:
  - url: "/DEV/MIN/PUKI/TOYS"
    description: DEV environment

tags:
  - name: Toys
    description: |-
      All about Toys

paths:
  /v1/toys:
    get:
      tags:
        - Toys
      summary: Get a list of toys
      operationId: toys_list
      security:
        - bearer_auth:
          - 'openid'

      description: |-
        This endpoint retrieves a list of toys.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "PT001"
                    name:
                      type: string
                      example: "Squeaky Rubber Ball"
                    category:
                      type: string
                      example: "Interactive"
                    pet_type:
                      type: string
                      example: "Dog"
                    price:
                      type: number
                      format: float
                      example: 12.99
                    material:
                      type: string
                      example: "Natural Rubber"

        '401':
          $ref: 'shared/responses/unauthorized.yml'

        '404':
          $ref: 'shared/responses/not_found.yml'

        '500':
          $ref: 'shared/responses/server_error.yml'

        default:
          $ref: 'shared/responses/unexpected_error.yml'

components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer