description: >-
  The response will be a JSON object with a key called `systems`. 
  This will be set to an array of system objects, each of which will contain the standard system attributes.

headers:
  ratelimit-limit:
    $ref: '../../../shared/headers.yml#/ratelimit-limit'
  ratelimit-remaining:
    $ref: '../../../shared/headers.yml#/ratelimit-remaining'
  ratelimit-reset:
    $ref: '../../../shared/headers.yml#/ratelimit-reset'

content:
  application/json:
    schema:
      allOf:
        - type: object
          properties:
            systems: 
              type: array
              items:
                $ref: '../models/system.yml'
          required:
            - systems
        - $ref: '../../../shared/pages.yml#/pagination'
        - $ref: '../../../shared/meta.yml'
    examples:
      All:
        $ref: 'examples.yml#/systems_all'
