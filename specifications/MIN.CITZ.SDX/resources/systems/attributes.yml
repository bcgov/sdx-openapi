# This file contains mappings of reused image attributes.
system_name:
  type: string
  description: >-
    The display name that has been given to a system. 
    This is what is shown in the control panel and is generally a descriptive title for the system in question.
  example: Nifty New System

system_description:
  type: string
  description: An optional free-form text field to describe a system.
  example: " "