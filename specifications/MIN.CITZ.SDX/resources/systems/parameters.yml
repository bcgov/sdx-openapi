
type:
  in: query
  name: type
  description: Filters results based on system type which can be either `application` or `distribution`.
  required: false
  schema:
    type: string
    enum:
      - application
      - distribution
  example: distribution

tag:
  in: query
  name: tag_name
  description: Used to filter systems by a specific tag.
  required: false
  schema:
    type: string
  example: base-image