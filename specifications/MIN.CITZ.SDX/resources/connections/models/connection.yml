type: object

properties:
  consumer:
    type: object
    properties:
      appId:
        type: string
        example: FDA8A444
      resourceLocator:
        type: string
        example: DEV.GOV.CITZ.SINGLE-DIGITAL-GW
      scopes:
        type: array
        items:
          type: string
        example:
          - user/VehicleOwnership.r
  provider:
    type: object
    properties:
      appId:
        type: string
        example: 1234ABCD
      resourceLocator:
        type: string
        example: DEV.BUS.ICBC.VEHICLE-REGISTRATION
      scopes:
        type: array
        items:
          type: string
        example:
          - user/VehicleOwnership.r
  status:
    type: string
    enum:
      - PendingApproval
      - Active
      - Draft
    example: PendingApproval
